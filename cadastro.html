<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>SmartStock - Cadastro de Produtos</title>
  <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
  <div class="container">
    <h1>📦 SmartStock</h1>
    <p>Cadastro de produtos com SKU automático</p>

    <form id="form-produto">
      <input type="text" id="nome" placeholder="Nome do Produto" required>
      <input type="text" id="categoria" placeholder="Categoria" required>
      <input type="text" id="cor" placeholder="Cor/Variante">
      <input type="text" id="tamanho" placeholder="Tamanho/Peso">
      <input type="text" id="sku" placeholder="SKU" readonly>
      <button type="submit">Cadastrar</button>
    </form>

    <h2>Produtos Cadastrados</h2>
    <ul id="lista-produtos"></ul>
  </div>

  <script src="scriptcadastro.js"></script>
</body>
</html>
